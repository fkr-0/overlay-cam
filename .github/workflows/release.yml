name: release

# Builds, signs, verifies and publishes the release APK for a version tag.
# Secrets are only available to tag pushes (never to forks or pull requests):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Repository variable:
#   ANDROID_RELEASE_CERT_SHA256  (public SHA-256 fingerprint of the signing certificate)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require tag to match versionName and CHANGELOG
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          test "$TAG" = "v${version}"
          grep -Fq "## [${version}] -" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret or variable: $name"
              exit 1
            fi
          done

      - name: Build Docker image
        run: docker build -t overlay-cam:android .

      - name: Unit tests
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -v "$HOME/.gradle":/.gradle \
            -w /work \
            overlay-cam:android \
            bash -lc "./scripts/gradle-in-docker.sh testDebugUnitTest"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.p12"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -v "$HOME/.gradle":/.gradle \
            -v "$RUNNER_TEMP/keystore":/keystore:ro \
            -e ANDROID_KEYSTORE_FILE=/keystore/release.p12 \
            -e ANDROID_KEYSTORE_PASSWORD -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            -w /work \
            overlay-cam:android \
            bash -lc "./scripts/gradle-in-docker.sh assembleRelease -PrequireReleaseSigning=true"

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/keystore"

      - name: Verify signature against the pinned certificate
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          install -m 0644 app/build/outputs/apk/release/app-release.apk "release-artifacts/overlay-cam-v${VERSION}.apk"
          python3 scripts/verify_release_signature.py "release-artifacts/overlay-cam-v${VERSION}.apk" \
            | tee release-artifacts/signature.json
          (cd release-artifacts && sha256sum "overlay-cam-v${VERSION}.apk" > SHA256SUMS)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-cam-v${{ steps.version.outputs.version }}-release-apk
          path: release-artifacts/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          # Use the matching CHANGELOG section as the release notes.
          awk -v v="## [${VERSION}] -" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > release-artifacts/NOTES.md
          gh release create "$TAG" \
            "release-artifacts/overlay-cam-v${VERSION}.apk" \
            "release-artifacts/SHA256SUMS" \
            --verify-tag \
            --title "Overlay Cam ${VERSION}" \
            --notes-file release-artifacts/NOTES.md
